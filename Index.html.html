function CapChart({trades,initial}) {
  if (!trades.length) return (
    <div style={{height:175,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:8,color:T.t2,fontSize:13,border:`1px dashed ${T.b1}`,borderRadius:12}}>
      <span style={{fontSize:28,opacity:.35}}>📈</span><span>أضف صفقات لرؤية منحنى رأس المال</span>
    </div>
  );
  const pts=[{x:0,y:initial}]; let c=initial;
  [...trades].reverse().forEach((t,i)=>{c+=parseFloat(t.pnl||0);pts.push({x:i+1,y:c});});
  const mn=Math.min(...pts.map(p=>p.y)),mx=Math.max(...pts.map(p=>p.y));
  const rng=mx-mn||1,W=700,H=175,PX=60,PY=12;
  const cx=x=>PX+(x/(pts.length-1||1))*(W-PX-8);
  const cy=y=>PY+(1-(y-mn)/rng)*(H-PY-22);
  const path=pts.map((p,i)=>(i?"L":"M")+cx(p.x).toFixed(1)+","+cy(p.y).toFixed(1)).join(" ");
  const area=path+` L${cx(pts.length-1).toFixed(1)},${H-18} L${cx(0).toFixed(1)},${H-18} Z`;
  const col=c>=initial?T.green:T.red;
  const fv=v=>Math.abs(v)>=1000?"$"+(Math.abs(v)/1000).toFixed(1)+"K":"$"+Math.abs(v).toFixed(0);
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={col} stopOpacity=".25"/><stop offset="100%" stopColor={col} stopOpacity="0"/></linearGradient>
        <filter id="gl"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      {[0,.25,.5,.75,1].map((t,i)=>{const y=PY+t*(H-PY-22),v=mx-t*rng;return <g key={i}><line x1={PX} y1={y} x2={W-6} y2={y} stroke={T.b1} strokeWidth=".6" strokeDasharray="3 9"/><text x={PX-5} y={y+4} textAnchor="end" fill={T.t3} fontSize="9" fontFamily="monospace">{fv(v)}</text></g>;})}
      <line x1={PX} y1={cy(initial)} x2={W-6} y2={cy(initial)} stroke={T.gold} strokeWidth="1" strokeDasharray="4 5" opacity=".4"/>
      <path d={area} fill="url(#ag)"/>
      <path d={path} fill="none" stroke={col} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" filter="url(#gl)"/>
      <circle cx={cx(0)} cy={cy(pts[0].y)} r="4.5" fill={T.gold} opacity=".9"/>
      {pts.length>1&&<><circle cx={cx(pts.length-1)} cy={cy(pts.at(-1).y)} r="5.5" fill={col} filter="url(#gl)"/><text x={cx(pts.length-1)+9} y={cy(pts.at(-1).y)+4} fill={col} fontSize="11.5" fontFamily="monospace" fontWeight="700">{fv(c)}</text></>}
    </svg>
  );
}

function DDChart({trades,initial}) {
  if (trades.length<2) return <div style={{height:85,display:"flex",alignItems:"center",justifyContent:"center",color:T.t2,fontSize:12}}>أضف صفقتين على الأقل</div>;
  let peak=initial,cap=initial;
  const pts=[{x:0,y:0}];
  [...trades].reverse().forEach((t,i)=>{cap+=parseFloat(t.pnl||0);if(cap>peak)peak=cap;pts.push({x:i+1,y:peak>0?(peak-cap)/peak*100:0});});
  const maxDD=Math.max(...pts.map(p=>p.y),1);
  const W=700,H=95,PX=36,PY=6;
  const cx=x=>PX+(x/(pts.length-1||1))*(W-PX-8);
  const cy=y=>PY+(y/maxDD)*(H-PY-16);
  const path=pts.map((p,i)=>(i?"L":"M")+cx(p.x).toFixed(1)+","+cy(p.y).toFixed(1)).join(" ");
  const area=path+` L${cx(pts.length-1).toFixed(1)},${H-12} L${cx(0).toFixed(1)},${H-12} Z`;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      <defs><linearGradient id="ddg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={T.red} stopOpacity=".35"/><stop offset="100%" stopColor={T.red} stopOpacity="0"/></linearGradient></defs>
      {[0,50,100].map((t,i)=>{const y=PY+(t/100)*(H-PY-16);return <g key={i}><line x1={PX} y1={y} x2={W-6} y2={y} stroke={T.b1} strokeWidth=".5" strokeDasharray="2 8"/><text x={PX-3} y={y+3} textAnchor="end" fill={T.t3} fontSize="8" fontFamily="monospace">{(t*maxDD/100).toFixed(1)+"%"}</text></g>;})}
      <path d={area} fill="url(#ddg)"/>
      <path d={path} fill="none" stroke={T.red} strokeWidth="1.8" strokeLinejoin="round"/>
    </svg>
  );
}


/* ════════════════════════════════════════
   ROSS SCANNER — تلقائي 100% بدون CORS
   يستخدم Finnhub فقط (لا Yahoo Finance)
   لأن Yahoo يمنع الطلبات من المتصفح
   ════════════════════════════════════════ */
function RossScanner() {
  const [stocks,   setStocks]   = useState([]);
  const [scanning, setScanning] = useState(false);
  const [lastScan, setLastScan] = useState(null);
  const [cd,       setCd]       = useState(30);
  const [phase,    setPhase]    = useState("idle");
  const [filter,   setFilter]   = useState("all");
  const [error,    setError]    = useState("");
  const timerRef = useRef(null);
  const cdRef    = useRef(null);
  const abortRef = useRef(false);

  /* ═══ قواعد Mutlak Capitals الصارمة ═══ */
  const ROSS = { minP:1, maxP:20, sweetMin:2, sweetMax:10, minChg:5, minVol:500000 };

  /* أسهم Mutlak Capitals المفضلة — صغيرة، متقلبة، تاريخ تحركات قوية */
  const WATCH = [
    "MARA","RIOT","COIN","SOUN","RGTI","QUBT","IONQ","BBAI",
    "PLTR","SMCI","RIVN","LCID","NIO","SOFI","HOOD","UPST",
    "AFRM","SPCE","RKLB","ASTS","ACHR","JOBY","MULN","FFIE",
    "GME","AMC","CLOV","WKHS","MVIS","ATER","BLNK","CHPT",
    "OCGN","SRNE","BNGO","KPLT","TLRY","SNDL","NVDA","AMD",
    "TSLA","F","PYPL","SQ","NKLA","GOEV","IDEX","NAKD",
  ];

  const calcScore = s => {
    let sc = 0;
    const p=s.price||0, chg=s.pct||0, vol=s.vol||0;
    if (p>=ROSS.sweetMin && p<=ROSS.sweetMax) sc += 30;
    else if (p>=ROSS.minP && p<=ROSS.maxP)    sc += 15;
    if      (chg>=30) sc += 30;
    else if (chg>=20) sc += 25;
    else if (chg>=10) sc += 20;
    else if (chg>=5)  sc += 10;
    if      (vol>=5000000)    sc += 25;
    else if (vol>=2000000)    sc += 20;
    else if (vol>=ROSS.minVol)sc += 10;
    if (s.news) sc += 15;
    return Math.min(sc, 100);
  };

  const sig = sc => {
    if (sc>=70) return {t:"🚀 إشارة قوية",  c:T.green,  bg:T.greenD};
    if (sc>=50) return {t:"⚡ إشارة جيدة",  c:T.gold,   bg:T.goldD};
    if (sc>=30) return {t:"👀 راقبه",        c:T.orange, bg:T.orangeD};
    return           {t:"😴 ضعيف",         c:T.t2,     bg:T.s2};
  };

  const isGolden = () => {
    // وقت السوق الأمريكي 9:30-11:30 EST محوّل لتوقيت العميل تلقائياً
    const nowUTC = new Date();
    // EST = UTC-5 في الشتاء، UTC-4 في الصيف (EDT)
    const estOffset = isDST(nowUTC) ? -4 : -5;
    const estTime = new Date(nowUTC.getTime() + estOffset * 60 * 60 * 1000);
    const estH = estTime.getUTCHours();
    const estM = estTime.getUTCMinutes();
    const estMins = estH * 60 + estM;
    return estMins >= 570 && estMins <= 690; // 9:30 - 11:30 EST
  };

  const isDST = (date) => {
    const jan = new Date(date.getFullYear(), 0, 1);
    const jul = new Date(date.getFullYear(), 6, 1);
    return date.getTimezoneOffset() < Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
  };

  const getLocalMarketTime = () => {
    const nowUTC = new Date();
    const estOffset = isDST(nowUTC) ? -4 : -5;
    const estTime = new Date(nowUTC.getTime() + estOffset * 60 * 60 * 1000);
    const estH = estTime.getUTCHours();
    const estM = estTime.getUTCMinutes();
    // تحويل لتوقيت العميل المحلي
    const localTime = new Date();
    const localH = localTime.getHours();
    const localM = localTime.getMinutes();
    const pad = n => String(n).padStart(2,'0');
    return {
      est:   pad(estH)+":"+pad(estM)+" EST",
      local: pad(localH)+":"+pad(localM)+" (توقيتك)",
      isOpen: estH >= 9 && (estH < 16 || (estH === 16 && estM === 0)),
    };
  };

  /* ═══════════════════════════════════════════
     المسح الرئيسي
     ١. جلب أسعار كل الأسهم من Finnhub دفعة دفعة
     ٢. فلترة بقواعد Mutlak Capitals الصارمة
     ٣. جلب أخبار للأسهم المؤهلة
     ٤. اختيار أفضل 4 بالنقاط
     ═══════════════════════════════════════════ */
  const runScan = useCallback(async () => {
    if (scanning) return;
    setScanning(true); setError(""); abortRef.current = false;
    setPhase("fetching");

    try {
      const results = [];
      const BATCH = 6; // دفعات لتجنب تجاوز الحد المجاني

      for (let i=0; i<WATCH.length; i+=BATCH) {
        if (abortRef.current) break;
        const batch = WATCH.slice(i, i+BATCH);

        const batchData = await Promise.all(batch.map(async sym => {
          try {
            const r = await fetch(
              `https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FKEY}`
            );
            if (!r.ok) return null;
            const q = await r.json();
            if (!q.c || q.c === 0 || q.c === null) return null;
            return {
              symbol: sym,
              price:  parseFloat(q.c)  || 0,
              pct:    parseFloat(q.dp) || 0,
              change: parseFloat(q.d)  || 0,
              high:   parseFloat(q.h)  || 0,
              low:    parseFloat(q.l)  || 0,
              open:   parseFloat(q.o)  || 0,
              prev:   parseFloat(q.pc) || 0,
              vol:    0, // Finnhub مجاني لا يعطي volume في quote
            };
          } catch { return null; }
        }));

        // فلترة بقواعد Mutlak Capitals فوراً
        const valid = batchData.filter(s =>
          s &&
          s.price >= ROSS.minP  &&
          s.price <= ROSS.maxP  &&
          s.pct   >= ROSS.minChg
        );
        results.push(...valid);

        // تأخير بين الدفعات لتجنب rate limit
        if (i + BATCH < WATCH.length) {
          await new Promise(r => setTimeout(r, 300));
        }
      }

      if (abortRef.current) { setScanning(false); return; }

      // ترتيب مبدئي وأخذ أفضل 10 لجلب الأخبار
      setPhase("filtering");
      const scored = results
        .map(s => ({...s, score: calcScore(s)}))
        .sort((a,b) => b.score - a.score)
        .slice(0, 10);

      // جلب الأخبار للأفضل 10
      if (scored.length > 0 && !abortRef.current) {
        const withNews = await Promise.all(scored.map(async s => {
          try {
            const today = new Date().toISOString().split("T")[0];
            // نجرب آخر 3 أيام لضمان ظهور الأخبار
            const from3 = new Date(Date.now() - 7*24*60*60*1000).toISOString().split("T")[0];
            const r = await fetch(
              `https://finnhub.io/api/v1/company-news?symbol=${s.symbol}&from=${from3}&to=${today}&token=${FKEY}`
            );
            const nd = await r.json();
            const hasNews = Array.isArray(nd) && nd.length > 0;
            // أحدث خبر
            const newsItem = hasNews ? nd[0] : null;
            const finalScore = calcScore({...s, news: hasNews});
            return {...s, news: hasNews, newsItem, score: finalScore};
          } catch {
            return s;
          }
        }));

        // الترتيب النهائي واختيار أفضل 4
        const final = withNews
          .sort((a,b) => b.score - a.score)
          .slice(0, 4);

        setStocks(final);
      } else {
        setStocks(scored.slice(0,4));
      }

    } catch (e) {
      setError("خطأ في الاتصال بـ Finnhub. سيعيد المحاولة تلقائياً...");
      setStocks([]);
    }

    setPhase("done");
    setLastScan(new Date());
    setScanning(false);
  }, [scanning]);

  /* ═══ تشغيل تلقائي فور فتح التبويب ═══ */
  useEffect(() => {
    // بدء فوري بدون انتظار
    const startTimer = setTimeout(() => runScan(), 500);

    // تحديث كل 30 ثانية
    timerRef.current = setInterval(() => {
      setCd(30);
      runScan();
    }, 30000);

    // عداد تنازلي
    cdRef.current = setInterval(() => {
      setCd(p => p <= 1 ? 30 : p - 1);
    }, 1000);

    return () => {
      clearTimeout(startTimer);
      clearInterval(timerRef.current);
      clearInterval(cdRef.current);
      abortRef.current = true;
    };
  }, []); // يعمل مرة واحدة عند فتح التبويب

  const filtered = stocks.filter(s => {
    if (filter==="strong") return s.score >= 70;
    if (filter==="good")   return s.score >= 50 && s.score < 70;
    if (filter==="news")   return s.news;
    if (filter==="golden") return s.price >= 2 && s.price <= 10;
    return true;
  });

  const fmtVol = v =>
    v >= 1e6 ? (v/1e6).toFixed(1)+"M" :
    v >= 1e3 ? (v/1e3).toFixed(0)+"K" : v ? String(v) : "—";

  const phaseText = {
    fetching:  "جارٍ جلب بيانات "+WATCH.length+" سهم من Finnhub...",
    filtering: "جارٍ تطبيق قواعد Mutlak Capitals وجلب الأخبار...",
    done:      "",
    idle:      "جارٍ التحضير...",
  };

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>

      {/* ══ Header ══ */}
      <div style={{background:`linear-gradient(135deg,${T.goldD},${T.s0})`,border:`1px solid ${T.gold}30`,borderRadius:16,padding:"18px 20px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{fontWeight:800,fontSize:14,color:T.gold,marginBottom:4}}>
              🔍 سكنر Mutlak Capitals — تلقائي 100%
            </div>
            <div style={{color:T.t2,fontSize:11.5,lineHeight:1.75}}>
              يفحص {WATCH.length} سهم بقواعد Mutlak Capitals الصارمة · Finnhub API
              <br/>

/* ════════════════════════════════════════
   RISK CALCULATOR COMPONENT
   ════════════════════════════════════════ */
function RiskCalc({curCap, userMode}) {
  const [entryV,  setEntryV]  = useState("");
  const [stopV,   setStopV]   = useState("");
  const [targV,   setTargV]   = useState("");
  const [riskPct, setRiskPct] = useState("1");

  const calc = useMemo(()=>{
    const e=parseFloat(entryV), s=parseFloat(stopV), r=parseFloat(riskPct)/100, t=parseFloat(targV);
    if(!e||!s||r<=0||curCap<=0) return null;
    const rp=Math.abs(e-s);
    if(!rp) return null;
    const ra=curCap*r, sh=Math.floor(ra/rp), ml=-(sh*rp);
    const pr=(t&&t!==e)?(sh*Math.abs(t-e)):null;
    const rv=pr!=null&&ra>0?(pr/ra).toFixed(2):null;
    return{ra,rp,sh,ml,pr,rv};
  },[entryV,stopV,riskPct,targV,curCap]);

  const IS={width:"100%",background:"#060C16",border:"1.5px solid #1B2D42",borderRadius:9,padding:"11px 14px",color:"#F0F6FF",fontSize:15,outline:"none",fontFamily:"monospace",transition:"border-color .15s",WebkitAppearance:"none"};

  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {userMode==="beginner"&&(
        <div style={{background:"#071428",border:"1px solid #3D8EF030",borderRadius:11,padding:"12px 15px",display:"flex",gap:10}}>
          <span style={{fontSize:20}}>💡</span>
          <div>
            <div style={{color:"#3D8EF0",fontWeight:700,fontSize:12.5,marginBottom:3}}>للمبتدئ — كيف تستخدم هذه الأداة</div>
            <div style={{color:"#6A8CAA",fontSize:12,lineHeight:1.7}}>أدخل سعر الدخول وسعر الـ Stop Loss، واختر نسبة المخاطرة — ستعرف كم سهم تشتري بالضبط</div>
          </div>
        </div>
      )}
      <div style={{background:"linear-gradient(135deg,#1E1608,#060C16)",border:"1px solid #C9A84C30",borderRadius:14,padding:"16px 19px"}}>
        <div style={{fontWeight:800,fontSize:14,color:"#C9A84C",marginBottom:3}}>⚖️ حاسبة المخاطرة</div>
        <div style={{color:"#6A8CAA",fontSize:11.5}}>يحسب عدد الأسهم المناسب بناءً على نسبة مخاطرتك من رأس مالك الحالي</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div>
          <label style={{display:"block",color:"#6A8CAA",fontSize:10,marginBottom:6,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>💵 سعر الدخول $</label>
          <input type="number" inputMode="decimal" placeholder="5.20" value={entryV} onChange={e=>setEntryV(e.target.value)} style={IS}
            onFocus={e=>{e.target.style.borderColor="#C9A84C";e.target.style.boxShadow="0 0 0 3px #C9A84C14";}}
            onBlur={e=>{e.target.style.borderColor="#1B2D42";e.target.style.boxShadow="none";}}/>
        </div>
        <div>
          <label style={{display:"block",color:"#6A8CAA",fontSize:10,marginBottom:6,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>🛑 سعر Stop Loss $</label>
          <input type="number" inputMode="decimal" placeholder="4.80" value={stopV} onChange={e=>setStopV(e.target.value)} style={IS}
            onFocus={e=>{e.target.style.borderColor="#E84545";e.target.style.boxShadow="0 0 0 3px #E8454514";}}
            onBlur={e=>{e.target.style.borderColor="#1B2D42";e.target.style.boxShadow="none";}}/>
        </div>
        <div>
          <label style={{display:"block",color:"#6A8CAA",fontSize:10,marginBottom:6,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>🎯 سعر الهدف $ (اختياري)</label>
          <input type="number" inputMode="decimal" placeholder="6.00" value={targV} onChange={e=>setTargV(e.target.value)} style={IS}
            onFocus={e=>{e.target.style.borderColor="#0DBF7A";e.target.style.boxShadow="0 0 0 3px #0DBF7A14";}}
            onBlur={e=>{e.target.style.borderColor="#1B2D42";e.target.style.boxShadow="none";}}/>
        </div>
        <div>
          <label style={{display:"block",color:"#6A8CAA",fontSize:10,marginBottom:6,fontWeight:700,textTransform:"uppercase",letterSpacing:.5}}>📊 نسبة المخاطرة %</label>
          <div style={{display:"flex",gap:6}}>
            {["0.5","1","1.5","2"].map(v=>(
              <button key={v} onClick={()=>setRiskPct(v)}
                style={{flex:1,padding:"11px 4px",borderRadius:8,border:`1.5px solid ${riskPct===v?"#C9A84C":"#1B2D42"}`,background:riskPct===v?"#1E1608":"transparent",color:riskPct===v?"#C9A84C":"#6A8CAA",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"monospace",transition:"all .15s"}}>
                {v+"%"}
              </button>
            ))}
          </div>
        </div>
      </div>

      {calc?(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(145px,1fr))",gap:11}}>
          {[
            {l:"عدد الأسهم",     v:calc.sh.toLocaleString(),                  c:"#C9A84C", ic:"📦", big:true, hint:"اشتري هذا العدد بالضبط"},
            {l:"أقصى خسارة",    v:"-$"+Math.abs(calc.ml).toFixed(0),          c:"#E84545", ic:"🛑", big:false,hint:"قيمة الـ Stop Loss"},
            {l:"مقدار المخاطرة", v:"$"+calc.ra.toFixed(0),                    c:"#F0A030", ic:"⚠️", big:false,hint:riskPct+"% من رأس مالك"},
            {l:"خطر لكل سهم",   v:"$"+calc.rp.toFixed(3),                    c:"#C0D4EE", ic:"📐", big:false,hint:"فرق الدخول والـ Stop"},
            ...(calc.pr!=null?[{l:"الربح المتوقع",v:"+$"+calc.pr.toFixed(0),  c:"#0DBF7A", ic:"💰", big:false,hint:"إذا وصل للهدف"}]:[]),
            ...(calc.rv!=null?[{l:"نسبة RR",v:calc.rv+":1",                   c:parseFloat(calc.rv)>=2?"#0DBF7A":"#F0A030",ic:"⚖️",big:false,hint:parseFloat(calc.rv)>=2?"✅ ممتاز":"⚠️ أقل من 2:1"}]:[]),
          ].map((k,i)=>(
            <div key={i} style={{background:k.big?"linear-gradient(135deg,#1E1608,#09111E)":"#09111E",border:`1.5px solid ${k.big?"#C9A84C60":"#14202F"}`,borderRadius:13,padding:"14px 16px",borderTop:`3px solid ${k.c}`,boxShadow:k.big?"0 4px 20px #C9A84C20":"none"}}>
              <div style={{fontSize:20,marginBottom:8}}>{k.ic}</div>
              <div style={{fontFamily:"monospace",fontWeight:900,fontSize:k.big?26:19,color:k.c,letterSpacing:-1}}>{k.v}</div>
              <div style={{color:"#6A8CAA",fontSize:10.5,marginTop:5,fontWeight:600}}>{k.l}</div>
              <div style={{color:"#364D63",fontSize:9.5,marginTop:2}}>{k.hint}</div>
            </div>
          ))}
        </div>
      ):(
        <div style={{textAlign:"center",padding:"32px 20px",background:"#09111E",borderRadius:12,border:"1px dashed #1B2D42",color:"#6A8CAA",fontSize:13}}>
          <div style={{fontSize:30,opacity:.35,marginBottom:8}}>⚖️</div>
          <div>أدخل سعر الدخول وسعر الـ Stop Loss</div>
          {entryV&&stopV&&Math.abs(parseFloat(entryV)-parseFloat(stopV))<0.001&&(
            <div style={{color:"#F0A030",fontSize:12,marginTop:6}}>⚠️ سعر الدخول وStop Loss متساويان</div>
          )}
        </div>
      )}

      <div style={{background:"#071428",border:"1px solid #3D8EF030",borderRadius:10,padding:"12px 15px",display:"flex",gap:9}}>
        <span style={{fontSize:17}}>💡</span>
        <div>
          <div style={{color:"#3D8EF0",fontWeight:700,fontSize:12,marginBottom:3}}>قاعدة Mutlak Capitals الذهبية</div>
          <div style={{color:"#6A8CAA",fontSize:11.5,lineHeight:1.8}}>
            {"رأس مالك "}<strong style={{color:"#C9A84C"}}>{fmtCap(curCap)}</strong>
            {" ← أقصى خسارة لكل صفقة "}<strong style={{color:"#E84545"}}>{"$"+(curCap*0.01).toFixed(0)}</strong>{" (1%)"}
          </div>
        </div>
      </div>
    </div>
  );
}


/* ════════════════════════════════════════

export default function App() {
  const [splash,setSplash]     = useState(true);
  const [onboarded,setOnboarded] = useState(false);
  const [ready,setReady]       = useState(false);
  const [userMode,setUserMode] = useState("beginner");
  const [userName,setUserName] = useState("");
  const [tab,setTab]           = useState("dash");
  const [trades,setTrades]     = useState([]);
  const [initial,setInitial]   = useState(1000);
  const [maxLoss,setMaxLoss]   = useState(200);
  const [goals,setGoals]       = useState({monthly:0,weekly:0,yearly:0});
  const [journals,setJournals] = useState({});
  const [preps,setPreps]       = useState({});
  const [form,setForm]         = useState(false);
  const [editT,setEditT]       = useState(null);
  const [detail,setDetail]     = useState(null);
  const [toast,setToast]       = useState(null);
  const [search,setSearch]     = useState("");
  const [filt,setFilt]         = useState("الكل");
  const [capEdit,setCapEdit]   = useState(false);
  const [capDraft,setCapDraft] = useState("");
  const [locked,setLocked]     = useState(false);
  const [showCfg,setShowCfg]   = useState(false);
  const [aiText,setAiText]     = useState("");
  const [aiBusy,setAiBusy]     = useState(false);
  const [aiErr,setAiErr]       = useState("");
  const [repPeriod,setRepPeriod] = useState("monthly");
  const [mg,setMg]             = useState("");
  const [wg,setWg]             = useState("");
  const [yg,setYg]             = useState("");
  const [selWeek,setSelWeek]   = useState(0);
  const [jContent,setJContent] = useState("");
  const [jRating,setJRating]   = useState(3);
  const [jSaved,setJSaved]     = useState(false);
  const [re,setRe]             = useState("");
  const [rs,setRs]             = useState("");
  const [rr2,setRr2]           = useState("1");
  const [rt,setRt]             = useState("");
  const [prepChecked,setPrepChecked] = useState([]);
  const [prepWl,setPrepWl]     = useState("");
  const [prepCat,setPrepCat]   = useState("");
  const [prepPlan,setPrepPlan] = useState("");
  const [prepGoal,setPrepGoal] = useState("");
  const [prepMood,setPrepMood] = useState("هادئ ✅");
  const [prepDone,setPrepDone] = useState(false);

  // Load DB
  useEffect(()=>{
    (async()=>{
      const [t,cap,ml,g,j,p,ob,um,un]=await Promise.all([
        DB.get("mc_t"),DB.get("mc_c"),DB.get("mc_ml"),DB.get("mc_g"),
        DB.get("mc_j"),DB.get("mc_p"),DB.get("mc_ob"),DB.get("mc_um"),DB.get("mc_un")
      ]);
      if(t)setTrades(t); if(cap)setInitial(cap); if(ml)setMaxLoss(ml);
      if(g){setGoals(g);setMg(String(g.monthly||""));setWg(String(g.weekly||""));setYg(String(g.yearly||""));}
      if(j)setJournals(j); if(p)setPreps(p);
      if(ob)setOnboarded(true);
      if(um)setUserMode(um);
      if(un)setUserName(un);
      setReady(true);
    })();
  },[]);

  useEffect(()=>{if(ready)DB.set("mc_t",trades);},[trades,ready]);
  useEffect(()=>{if(ready)DB.set("mc_c",initial);},[initial,ready]);
  useEffect(()=>{if(ready)DB.set("mc_ml",maxLoss);},[maxLoss,ready]);
  useEffect(()=>{if(ready)DB.set("mc_g",goals);},[goals,ready]);
  useEffect(()=>{if(ready)DB.set("mc_j",journals);},[journals,ready]);
  useEffect(()=>{if(ready)DB.set("mc_p",preps);},[preps,ready]);

  const handleOnboardingDone = useCallback(async({mode,capital,name})=>{
    setUserMode(mode); setUserName(name); setInitial(parseFloat(capital)||1000);
    setMaxLoss(parseFloat(capital)*0.025||200);
    setOnboarded(true);
    await Promise.all([DB.set("mc_ob",true),DB.set("mc_um",mode),DB.set("mc_un",name),DB.set("mc_c",parseFloat(capital)||1000)]);
  },[]);

  const notify=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2800);};

  const totalPnL=useMemo(()=>trades.reduce((s,t)=>s+parseFloat(t.pnl||0),0),[trades]);
  const curCap=useMemo(()=>initial+totalPnL,[initial,totalPnL]);
  const growth=initial?((curCap/initial-1)*100).toFixed(1):"0";

  const stats=useMemo(()=>{
    if(!trades.length)return null;
    const W=trades.filter(t=>parseFloat(t.pnl||0)>0);
    const L=trades.filter(t=>parseFloat(t.pnl||0)<0);
    const wr=Math.round(W.length/trades.length*100);
    const avgW=W.length?W.reduce((s,t)=>s+parseFloat(t.pnl),0)/W.length:0;
    const avgL=L.length?Math.abs(L.reduce((s,t)=>s+parseFloat(t.pnl),0)/L.length):0;
    const rr=avgL>0?(avgW/avgL).toFixed(2):"∞";
    const disc=Math.round(trades.filter(t=>t.disc).length/trades.length*100);
    let streak=0,cur=0;
    [...trades].reverse().forEach(t=>{parseFloat(t.pnl||0)>0?(cur++,streak=Math.max(streak,cur)):cur=0;});
    const gW=W.reduce((s,t)=>s+parseFloat(t.pnl),0);
    const gL=Math.abs(L.reduce((s,t)=>s+parseFloat(t.pnl),0)||1);
    const exp=(W.length/trades.length*avgW)-(L.length/trades.length*avgL);
    const pf=gW/gL;
    let peak=initial,cap=initial,maxDD=0;
    [...trades].reverse().forEach(t=>{cap+=parseFloat(t.pnl||0);if(cap>peak)peak=cap;const dd=(peak-cap)/peak*100;if(dd>maxDD)maxDD=dd;});
    const byDay={};const dn=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
    trades.forEach(t=>{const d=new Date(t.date).getDay(),n=dn[d];if(!byDay[n])byDay[n]={pnl:0,n:0};byDay[n].pnl+=parseFloat(t.pnl||0);byDay[n].n++;});
    const byMistake={};
    trades.filter(t=>t.mistakeType).forEach(t=>{if(!byMistake[t.mistakeType])byMistake[t.mistakeType]={n:0,loss:0};byMistake[t.mistakeType].n++;byMistake[t.mistakeType].loss+=Math.min(parseFloat(t.pnl||0),0);});
    const bestT=W.length?W.reduce((m,t)=>parseFloat(t.pnl)>parseFloat(m.pnl)?t:m,W[0]):null;
    const worstT=L.length?L.reduce((m,t)=>parseFloat(t.pnl)<parseFloat(m.pnl)?t:m,L[0]):null;
    return{wr,avgW,avgL,rr,disc,streak,wins:W.length,losses:L.length,exp,pf,maxDD,byDay,byMistake,bestT,worstT};
  },[trades,initial]);

  const saveTrade=useCallback(d=>{
    setTrades(p=>d.id&&p.find(t=>t.id===d.id)?p.map(t=>t.id===d.id?d:t):[{...d,id:Date.now()},...p]);
    setForm(false);setEditT(null);
    notify("✅ "+d.ticker+" — "+(parseFloat(d.pnl)>=0?"ربح":"خسارة")+" $"+Math.abs(parseFloat(d.pnl||0)).toFixed(0));
  },[]);
  const delTrade=useCallback(id=>{setTrades(p=>p.filter(t=>t.id!==id));setDetail(null);notify("🗑️ تم حذف الصفقة","warn");},[]);

  const visible=useMemo(()=>trades.filter(t=>{
    const ms=!search||t.ticker?.toUpperCase().includes(search.toUpperCase())||t.reason?.includes(search);
    const mf=filt==="الكل"||(filt==="رابحة"&&parseFloat(t.pnl||0)>0)||(filt==="خاسرة"&&parseFloat(t.pnl||0)<0);
    return ms&&mf;
  }),[trades,search,filt]);

  const today=new Date().toISOString().split("T")[0];
  const todayTrades=useMemo(()=>trades.filter(t=>t.date===today),[trades,today]);
  const todayPnL=useMemo(()=>todayTrades.reduce((s,t)=>s+parseFloat(t.pnl||0),0),[todayTrades]);
  const todayLoss=todayTrades.filter(t=>parseFloat(t.pnl||0)<0).length;
  const consec=useMemo(()=>{let c=0;for(const t of todayTrades){if(parseFloat(t.pnl||0)<0)c++;else c=0;}return c;},[todayTrades]);
  useEffect(()=>setLocked(todayLoss>=3||todayPnL<=-maxLoss),[todayLoss,todayPnL,maxLoss]);

  const grouped=useMemo(()=>{
    const map={};trades.forEach(t=>{
      const d=new Date(t.date);
      const key=repPeriod==="monthly"?d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"):d.getFullYear()+"-W"+String(Math.ceil((d.getDate()+new Date(d.getFullYear(),d.getMonth(),1).getDay())/7)).padStart(2,"0");
      if(!map[key])map[key]={pnl:0,cnt:0,wins:0};
      map[key].pnl+=parseFloat(t.pnl||0);map[key].cnt++;
      if(parseFloat(t.pnl||0)>0)map[key].wins++;
    });
    return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
  },[trades,repPeriod]);

  const weeks2=useMemo(()=>{
    const map={};trades.forEach(t=>{
      const d=new Date(t.date),s2=new Date(d);s2.setDate(d.getDate()-d.getDay());
      const k=s2.toISOString().split("T")[0];
      if(!map[k])map[k]={trades:[],pnl:0,wins:0};
      map[k].trades.push(t);map[k].pnl+=parseFloat(t.pnl||0);
      if(parseFloat(t.pnl||0)>0)map[k].wins++;
    });
    return Object.entries(map).sort((a,b)=>b[0].localeCompare(a[0]));
  },[trades]);

  const rcalc=useMemo(()=>{
    const e=parseFloat(re),s=parseFloat(rs),r=parseFloat(rr2)/100,t2=parseFloat(rt);
    if(!e||!s||!r||!curCap)return null;
    const ra=curCap*r,rp=Math.abs(e-s);if(!rp)return null;
    const sh=Math.floor(ra/rp),ml=-(sh*rp),pr=t2?(sh*Math.abs(t2-e)):null,rv=pr!=null?(pr/ra).toFixed(2):null;
    return{ra,rp,sh,ml,pr,rv};
  },[re,rs,rr2,rt,curCap]);

  const PREP_CHECKS=["سأتداول فقط بين 9:30 و 11:30","Stop Loss جاهز قبل الدخول","لن أخاطر بأكثر من 1% في صفقة","إذا خسرت 3 مرات متتالية سأتوقف","لن أتداول بعاطفة الانتقام"];

  const now2=new Date();
  const thisM=now2.getFullYear()+"-"+String(now2.getMonth()+1).padStart(2,"0");
  const thisY=String(now2.getFullYear());
  const mPnL=useMemo(()=>trades.filter(t=>t.date?.startsWith(thisM)).reduce((s,t)=>s+parseFloat(t.pnl||0),0),[trades,thisM]);
  const yPnL=useMemo(()=>trades.filter(t=>t.date?.startsWith(thisY)).reduce((s,t)=>s+parseFloat(t.pnl||0),0),[trades,thisY]);

  const TABS=[
    {id:"dash",   i:"📊", n:"اللوحة"},
    {id:"scanner",i:"🔍", n:"سكنر Mutlak Capitals"},
    {id:"prep",   i:"🌅", n:"تجهيز اليوم"},

                      <div style={{display:"flex",gap:12,marginTop:8,flexWrap:"wrap"}}>

                        <span style={{fontSize:11,fontFamily:"monospace",color:totalPnL>=0?T.green:T.red}}>{fmtPnl(totalPnL)}</span>

                  <CapChart trades={trades} initial={initial}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(142px,1fr))",gap:10}}>
                  {[
                    {l:"إجمالي الربح",v:"+$"+trades.filter(t=>parseFloat(t.pnl||0)>0).reduce((s,t)=>s+parseFloat(t.pnl),0).toFixed(0),c:T.green,ic:"💰",s:stats.wins+" رابحة"},
                    {l:"إجمالي الخسارة",v:"-$"+Math.abs(trades.filter(t=>parseFloat(t.pnl||0)<0).reduce((s,t)=>s+parseFloat(t.pnl),0)).toFixed(0),c:T.red,ic:"📉",s:stats.losses+" خاسرة"},

                    {l:"Profit Factor",v:stats.pf.toFixed(2)+"x",c:stats.pf>=1.5?T.green:T.orange,ic:"⚖️",s:"الحد 1.5x"},
                    {l:"أفضل صفقة",v:stats.bestT?"+$"+Math.abs(parseFloat(stats.bestT.pnl)).toFixed(0):"—",c:T.green,ic:"🏆",s:stats.bestT?.ticker||"—"},

                      <div style={{fontSize:17,marginBottom:7}}>{k.ic}</div>
                      <div style={{fontFamily:"monospace",fontWeight:900,fontSize:17,color:k.c,letterSpacing:-1}}>{k.v}</div>

            const nowUTC=new Date();
            const jan=new Date(nowUTC.getFullYear(),0,1);
            const jul=new Date(nowUTC.getFullYear(),6,1);
            const dst=nowUTC.getTimezoneOffset()<Math.max(jan.getTimezoneOffset(),jul.getTimezoneOffset());

            const localOff=-nowUTC.getTimezoneOffset()/60;
            const diff=localOff-estOff;
            const h=Math.floor(9+diff);
            const pad=n=>String(n).padStart(2,"0");

              <p style={{color:T.t2,fontSize:12.5,lineHeight:1.85}}>{"من "}</p>
            </div>
            {[{n:"01",ic:"🚀",c:T.green,t:"أسهم صغيرة ذات زخم فقط",d:"$2-$10، حجم 5x+، محفّز إخباري."},{n:"02",ic:"🛡️",c:T.blue,t:"لا تخاطر بأكثر من 1% في صفقة",d:"رأس مال $5K = حد خسارة $50."},{n:"03",ic:"⚖️",c:T.gold,t:"نسبة RR 2:1 حداً أدنى",d:"هدفك دائماً ضعف مخاطرتك."},{n:"04",ic:"🛑",c:T.red,t:"Stop Loss في كل صفقة",d:"الصفقة بدون Stop هي مقامرة."},{n:"05",ic:"⏰",c:T.blue,t:"التداول 9:30-11:30 EST",d:"أقوى وقت زخم. Mutlak Capitals يغلق بعد ساعتين."},{n:"06",ic:"⏸️",c:T.red,t:"3 خسائر متتالية = توقف",d:"توقف واستراح وعد غداً."},{n:"07",ic:"✂️",c:T.gold,t:"خذ الأرباح ولا تتطمع",d:"عند الوصول للهدف أغلق فوراً."},{n:"08",ic:"🧘",c:T.red,t:"لا تداول بعاطفة الانتقام",d:"الخسارة + الانتقام = كارثة."}].map(r=>(
              <div key={r.n} style={{background:T.s1,border:`1px solid ${T.b0}`,borderRadius:12,padding:"14px 16px",borderRight:`4px solid ${r.c}`,transition:"transform .2s"}} onMouseEnter={e=>e.currentTarget.style.transform="translateX(-4px)"} onMouseLeave={e=>e.currentTarget.style.transform=""}>
                <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                  <div style={{fontSize:19,flexShrink:0,marginTop:1}}>{r.ic}</div>
                  <div><div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4}}><span style={{fontFamily:"monospace",fontSize:9.5,color:r.c,fontWeight:700,background:r.c+"14",padding:"2px 7px",borderRadius:5}}>{"قاعدة "+r.n}</span><span style={{fontWeight:800,fontSize:13}}>{r.t}</span></div><p style={{color:T.t2,fontSize:11.5,lineHeight:1.75}}>{r.d}</p></div>
                </div>
              </div>
            ))}
          </div>
        )}
      </main>

      {/* ════ FOOTER ════ */}
      <footer style={{background:T.s0,borderTop:`1px solid ${T.b0}`}}>
        <div style={{height:1,background:`linear-gradient(90deg,transparent,${T.gold}40,transparent)`}}/>
        <div style={{maxWidth:1440,margin:"0 auto",padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:7}}>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <img src={LOGO} alt="" style={{height:18,opacity:.6}}/>
            <span style={{color:T.t3,fontSize:10.5}}>{"© 2025 Mutlak Capitals · Journal & Scanner PRO "+APP_VERSION}</span>
          </div>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <span style={{color:T.t3,fontSize:10}}>⚠️ للأغراض التعليمية فقط</span>
            {trades.length>0&&<span style={{color:T.gold,fontFamily:"monospace",fontSize:11,fontWeight:700,background:T.goldD,padding:"2px 8px",borderRadius:5}}>{trades.length+" صفقة"}</span>}
          </div>
        </div>
      </footer>

      {/* ════ MODALS ════ */}
      {form&&<TradeForm onSave={saveTrade} onClose={()=>{setForm(false);setEditT(null);}} edit={editT} curCap={curCap} locked={locked&&!editT} mode={userMode}/>}

      {detail&&(
        <div style={{position:"fixed",inset:0,background:"rgba(3,7,13,.96)",backdropFilter:"blur(12px)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:14,direction:"rtl"}}>
          <div style={{background:T.s1,border:`1px solid ${T.b2}`,borderRadius:18,width:"100%",maxWidth:460,padding:"21px 23px",boxShadow:`0 32px 80px rgba(0,0,0,.7),0 0 0 1px ${T.gold}15`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,paddingBottom:12,borderBottom:`1px solid ${T.b0}`}}>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <span style={{fontFamily:"monospace",fontWeight:900,fontSize:20,color:T.gold}}>{detail.ticker}</span>
                <span style={{padding:"3px 12px",borderRadius:99,fontWeight:700,fontSize:12.5,fontFamily:"monospace",background:parseFloat(detail.pnl)>=0?T.greenD:T.redD,color:parseFloat(detail.pnl)>=0?T.green:T.red}}>{fmtPnl(detail.pnl)}</span>
              </div>
              <button onClick={()=>setDetail(null)} style={{background:T.b0,border:"none",color:T.t2,borderRadius:8,width:28,height:28,cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            </div>
            {[["📅 التاريخ",detail.date],["💵 الدخول","$"+detail.entry],["🎯 الخروج","$"+detail.exit],["📦 الأسهم",detail.shares+" سهم"],["⚖️ نسبة RR",detail.rr?detail.rr+":1":"—"],["🚀 سبب الدخول",detail.reason||"—"],["🧠 الحالة النفسية",detail.mood||"—"],["📋 الالتزام",detail.disc?"✅ نعم":"❌ لا"],["❌ نوع الخطأ",detail.mistakeType||"—"]].map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${T.b0}10`}}>
                <span style={{color:T.t2,fontSize:12}}>{k}</span><span style={{fontWeight:600,fontSize:12,color:T.t0}}>{v}</span>
              </div>
            ))}
            {detail.notes&&<div style={{marginTop:10,background:T.s2,borderRadius:9,padding:"9px 12px",border:`1px solid ${T.b0}`}}><div style={{color:T.t3,fontSize:9.5,marginBottom:3}}>📝 الملاحظات</div><div style={{fontSize:12,lineHeight:1.7,color:T.t1}}>{detail.notes}</div></div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:12}}>
              <button onClick={()=>{setEditT(detail);setDetail(null);setForm(true);}} style={{padding:"10px",borderRadius:9,background:"transparent",border:`1.5px solid ${T.b1}`,color:T.t2,cursor:"pointer",fontWeight:700,fontSize:12,transition:"all .15s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=T.gold;e.currentTarget.style.color=T.gold;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=T.b1;e.currentTarget.style.color=T.t2;}}>✏️ تعديل</button>
              <button onClick={()=>delTrade(detail.id)} style={{padding:"10px",borderRadius:9,background:T.redD,border:`1.5px solid ${T.red}40`,color:T.red,cursor:"pointer",fontWeight:700,fontSize:12}}>🗑️ حذف</button>
            </div>
          </div>
        </div>
      )}

      {toast&&<div style={{position:"fixed",bottom:22,left:"50%",transform:"translateX(-50%)",background:T.s1,border:`1.5px solid ${toast.type==="ok"?T.gold:T.red}`,borderRadius:11,padding:"11px 22px",color:T.t0,fontWeight:700,fontSize:13,zIndex:999,animation:"fadeUp .3s ease",boxShadow:`0 8px 32px ${toast.type==="ok"?T.gold:T.red}28`,whiteSpace:"nowrap"}}>{toast.msg}</div>}
    </div>
  );
}


    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(React.createElement(App));
    setTimeout(window.__hideLoading, 100);
  </script>
</body>
</html>
